<style>* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f0f2f5; font-family: Arial, "Segoe UI", sans-serif; padding: 24px; }
.slide {
  position: relative;
  width: 1280px; height: 720px;
  background: #ffffff;
  margin: 0 auto 28px;
  border: 1px solid #dfe3ea;
  overflow: hidden;
  page-break-after: always;
}
.panel {
  position: absolute; inset: 88px 16px 16px 16px;
  border-radius: 20px;
  background: linear-gradient(135deg, #f1f7fe 0%, #e2edfb 100%);
  border: 1px solid #d7e3f4;
}
.title {
  position: absolute; top: 20px; left: 34px;
  font-size: 29px; font-weight: 800; color: #21365e; letter-spacing: .1px;
}
.subtitle {
  position: absolute; top: 55px; left: 35px;
  font-size: 14px; font-weight: 500; color: #5b6b8c;
}
.proj {
  position: absolute; top: 24px; right: 34px;
  font-size: 12px; font-weight: 700; color: #9aa3b2; letter-spacing: 1.5px;
}
.wires { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; }
.wire { fill: none; stroke: #2E6DB4; stroke-width: 2; }
.wire.dash { stroke-dasharray: 5 4; stroke: #7f93b4; }
.box {
  position: absolute;
  background: #fff;
  border: 2px solid #3DA0C7;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 12px 16px;
  font-size: 13px; line-height: 1.22; color: #21283a;
  box-shadow: 0 2px 5px rgba(30,50,90,.12);
}
.box.algo   { border-color: #6E4B9E; }
.box.llm    { border-color: #E0912F; }
.box.human  { border-color: #2E8B6B; }
.box.entry  { border-color: #3DA0C7; }
.box.notdev { border-color: #B9BEC7; background: #edeff2; color: #5c6472; box-shadow: none; }
.box.stage  { border: none; background: linear-gradient(180deg, #F6A83C 0%, #EE7B1C 100%); color: #fff; font-weight: 700; }
.box b { font-weight: 700; }
.box .tu { color: #b06a00; font-weight: 700; }
.numc {
  position: absolute; width: 32px; height: 32px; border-radius: 50%;
  background: #fff; border: 2px solid #8a93a3;
  color: #34405a; font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.18);
}
.elabel {
  position: absolute; text-align: center; font-size: 12px; font-style: italic;
  color: #43506b; background: rgba(241,247,254,.9); padding: 1px 4px; border-radius: 3px;
}
.elabel.strong { font-style: normal; font-weight: 800; font-size: 15px; color: #21365e; background: transparent; }
.legend {
  position: absolute; bottom: 22px; left: 34px;
  display: flex; gap: 22px; align-items: center;
}
.lgi { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #33405a; }
.sw { width: 20px; height: 15px; border-radius: 4px; border: 2px solid #999; background: #fff; display: inline-block; }
.sw.algo   { border-color: #6E4B9E; }
.sw.llm    { border-color: #E0912F; }
.sw.human  { border-color: #2E8B6B; }
.sw.entry  { border-color: #3DA0C7; }
.sw.notdev { border-color: #B9BEC7; background: #edeff2; }

.annot {
  position: absolute; font-size: 11px; font-weight: 700; color: #7a8194;
  text-transform: uppercase; letter-spacing: .4px; line-height: 1.25; text-align: right;
}
.sheet { position: absolute; inset: 96px 34px 60px 34px; overflow: hidden; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 12px; color: #222; }
.sheet th { background: #21365e; color: #fff; font-weight: 700; text-align: left; padding: 6px 9px; border: 1px solid #d7dde6; }

.sheet tr:nth-child(even) td { background: #f4f7fb; }
.sheet .sec td { background: #e6ecf5; font-weight: 700; }
.sheet h3 { font-size: 14px; color: #21365e; margin: 10px 0 4px; }

<div id="root"></div>
<script>// Slide render engine — fixed 1280x720 canvas, SVG orthogonal arrows.
function anchor(b, side) {
  const map = {
    t: [b.x + b.w / 2, b.y],
    b: [b.x + b.w / 2, b.y + b.h],
    l: [b.x, b.y + b.h / 2],
    r: [b.x + b.w, b.y + b.h / 2],
    c: [b.x + b.w / 2, b.y + b.h / 2],
    tl: [b.x + b.w * 0.28, b.y], tr: [b.x + b.w * 0.72, b.y],
    bl: [b.x + b.w * 0.28, b.y + b.h], br: [b.x + b.w * 0.72, b.y + b.h],
  };
  return map[side];
}

function renderSlide(spec) {
  const boxMap = {};
  (spec.boxes || []).forEach(b => boxMap[b.id] = b);

  const slide = document.createElement("div");
  slide.className = "slide";

  const panel = document.createElement("div");
  panel.className = "panel";
  slide.appendChild(panel);

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = spec.title;
  slide.appendChild(title);

  if (spec.subtitle) {
    const st = document.createElement("div");
    st.className = "subtitle";
    st.textContent = spec.subtitle;
    slide.appendChild(st);
  }

  const proj = document.createElement("div");
  proj.className = "proj";
  proj.textContent = "ПРОЕКТ";
  slide.appendChild(proj);

  // SVG layer
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "wires");
  svg.setAttribute("viewBox", "0 0 1280 720");
  const defs = document.createElementNS(svgNS, "defs");
  defs.innerHTML = `<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2E6DB4"/></marker>`;
  svg.appendChild(defs);
  slide.appendChild(svg);

  (spec.arrows || []).forEach(a => {
    const [fid, fside] = a.from.split(":");
    const [tid, tside] = a.to.split(":");
    const p0 = anchor(boxMap[fid], fside);
    const p1 = anchor(boxMap[tid], tside);
    const pts = [p0, ...(a.via || []), p1];
    const d = "M " + pts.map(p => p.join(" ")).join(" L ");
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "wire" + (a.dash ? " dash" : ""));
    path.setAttribute("marker-end", "url(#ah)");
    svg.appendChild(path);
  });

  // free-form annotations
  (spec.annots || []).forEach(an => {
    const el = document.createElement("div");
    el.className = "annot";
    el.style.left = an.x + "px";
    el.style.top = an.y + "px";
    el.style.width = (an.w || 180) + "px";
    el.innerHTML = an.html;
    slide.appendChild(el);
  });

  // sheet (raw HTML content, e.g. tables)
  if (spec.sheet) {
    const sh = document.createElement("div");
    sh.className = "sheet";
    sh.innerHTML = spec.sheet;
    slide.appendChild(sh);
  }

  // boxes
  (spec.boxes || []).forEach(b => {
    const el = document.createElement("div");
    el.className = "box " + (b.cls || "");
    el.style.left = b.x + "px";
    el.style.top = b.y + "px";
    el.style.width = b.w + "px";
    el.style.height = b.h + "px";
    if (b.fs) el.style.fontSize = b.fs + "px";
    el.innerHTML = b.html;
    slide.appendChild(el);
  });

  // numbered circles
  (spec.nums || []).forEach(n => {
    const c = document.createElement("div");
    c.className = "numc";
    c.style.left = (n.x - 16) + "px";
    c.style.top = (n.y - 16) + "px";
    c.textContent = n.n;
    slide.appendChild(c);
  });

  // edge labels
  (spec.labels || []).forEach(l => {
    const el = document.createElement("div");
    el.className = "elabel" + (l.strong ? " strong" : "");
    el.style.left = (l.x - 60) + "px";
    el.style.top = (l.y - 12) + "px";
    el.style.width = "120px";
    el.textContent = l.text;
    slide.appendChild(el);
  });

  // legend
  if (spec.legend) {
    const lg = document.createElement("div");
    lg.className = "legend";
    spec.legend.forEach(([label, cls]) => {
      const item = document.createElement("div");
      item.className = "lgi";
      item.innerHTML = `<span class="sw ${cls}"></span>${label}`;
      lg.appendChild(item);
    });
    slide.appendChild(lg);
  }

  document.getElementById("root").appendChild(slide);
}

function renderAll(slides) { slides.forEach(renderSlide); }
</script>
